# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.13.1"

[tox]
test_runner = "pytest"
use_pytest_plone = false

[pyproject]
dependencies_ignores = "['stdlib_list',]"
check_manifest_extra_lines = """
ignore-bad-ideas = [
    "tests/sample1/src/sample1.egg-info_in/PKG-INFO",
    ]
"""
extra_lines = """
[tool.zestreleaser]
create-wheel = true
extra-message = "[ci skip]"
"""

[github]
jobs = [
  "qa",
  "coverage",
  "release_ready",
  "circular",
]
